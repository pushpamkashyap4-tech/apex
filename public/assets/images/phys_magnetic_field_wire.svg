<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Magnetic field around a straight current-carrying wire</title>
  <desc id="desc">Concentric magnetic field circles surround a wire carrying current out of the page.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#2563eb"/></marker></defs>
  <rect width="600" height="400" rx="18" fill="#fff"/>
  <text x="300" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172554">Magnetic field around a straight wire</text>
  <g fill="none" stroke="#2563eb" stroke-width="3">
    <circle cx="270" cy="213" r="62"/><circle cx="270" cy="213" r="112"/><circle cx="270" cy="213" r="162"/>
    <path d="M331 213a61 61 0 0 0-22-47" marker-end="url(#arrow)"/><path d="M381 213a111 111 0 0 0-39-79" marker-end="url(#arrow)"/><path d="M431 213a161 161 0 0 0-56-114" marker-end="url(#arrow)"/>
  </g>
  <circle cx="270" cy="213" r="24" fill="#ef4444"/><circle cx="270" cy="213" r="7" fill="#fff"/>
  <text x="270" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#ef4444">I</text>
  <text x="300" y="378" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Current out of the page (⊙); field direction follows the right-hand rule</text>
</svg>
