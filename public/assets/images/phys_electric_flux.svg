<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Electric flux through a spherical Gaussian surface</title>
  <desc id="desc">A positive point charge lies at the center of a spherical Gaussian surface with outward electric field lines.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#dc2626"/></marker></defs>
  <rect width="600" height="400" rx="18" fill="#fff"/>
  <text x="300" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172554">Electric flux through a Gaussian surface</text>
  <circle cx="300" cy="213" r="126" fill="#eff6ff" fill-opacity=".55" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6"/>
  <g stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)">
    <path d="M300 204V90"/><path d="M300 222v111"/><path d="M291 213H177"/><path d="M309 213h114"/>
    <path d="m293 206-79-79"/><path d="m307 220 79 79"/><path d="m307 206 79-79"/><path d="m293 220-79 79"/>
  </g>
  <circle cx="300" cy="213" r="23" fill="#fbbf24" stroke="#b45309" stroke-width="2"/><text x="300" y="219" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#7c2d12">+q</text>
  <text x="300" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Outward flux: Φ<tspan baseline-shift="sub" font-size="12">E</tspan> = q<tspan baseline-shift="sub" font-size="12">enc</tspan>/ε₀</text>
</svg>
